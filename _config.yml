# Site
name: "ThinkPrivacy"
title: "ThinkPrivacy_"
description: "It's your data, take control of it."
logo: 'assets/images/tp_lock.png'
favicon: 'assets/images/tp_lock.png'
baseurl: 
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  thinkprivacy:
    name: Dan
    display_name: Dan Arel
    gravatar: e56154546cf4be74e393c62d1ae9f9d4
    email: dan@thinkprivacy.net
    web: https://www.thinkprivacy.net
    twitter: https://twitter.com/ThinkPrivacy_
    description: "Owner of ThinkPrivacy_"
 
# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 20
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
